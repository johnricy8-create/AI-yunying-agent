# 电商运营 Agent - 业务配置
# 所有阈值均为 v0.1 默认值，后续应结合真实数据校准。
# 密钥不写在这里，只放 .env。

app:
  # 统一使用北京时间；Windows 需要 tzdata 包
  timezone: Asia/Shanghai
  # 默认模拟数据文件（相对项目根目录）
  data_file: data/mock/sales_mock.csv
  # 报告与日志目录（相对项目根目录，可在命令行覆盖）
  report_dir: reports
  log_dir: logs

baseline:
  # 候选窗口（天），不含统计日当天
  windows: [3, 5, 7]
  # 变异系数分界：CV < cv_low 用最长窗口；cv_low <= CV < cv_high 用中间窗口；否则用最短窗口
  cv_low: 0.15
  cv_high: 0.30
  # 正常置信度要求的最少有效历史天数
  min_valid_days: 3
  # 最多回看多少个自然日的历史
  lookback_days: 7
  # 新品首日豁免；第 2 天起参与判定并标注低置信
  new_product_exempt_days: 1

anomaly:
  # 比率类规则的最小样本门槛，避免小样本误报
  min_pv_for_ratio: 50
  min_pv_for_zero_conversion: 100
  min_pv_for_high_pv: 100
  min_orders_for_drop: 3
  # 触发阈值
  pv_drop_ratio: 0.70
  order_drop_ratio: 0.70
  high_pv_ratio: 1.20
  low_cr_ratio: 0.60
  # 各规则基础严重分
  severity:
    zero_conversion: 50
    pv_drop: 30
    order_drop: 30
    high_pv_low_cr: 25
  # 严重度分级
  levels:
    high: 70
    medium: 40
  # 库存异常默认关闭：当前库存只展示与校验
  inventory:
    enabled: false
    low_stock_days: 3
    overstock_days: 60

report:
  # 报告展示的异常商品数量
  top_n: 10
  # 商品简介在报告中的最大展示字数
  description_max_chars: 200
  filename_pattern: "{date}_daily_report.md"

llm:
  enabled: true
  provider: zhipu
  # 模型与地址可由 .env 的 LLM_MODEL / ZHIPU_BASE_URL 覆盖
  model: glm-4.7-flash
  base_url: https://open.bigmodel.cn/api/paas/v4
  temperature: 0.2
  max_tokens: 6000
  timeout_seconds: 90
  # 首次 + 2 次重试；遇到 1305/429/5xx/超时按下面的间隔退避
  max_attempts: 3
  retry_backoff_seconds: [5, 15]
  # 只分析严重度最高的 N 个异常，控制单次请求体量
  max_anomalies: 10
  # 关闭思考模式，保证 JSON 输出稳定、延迟更低
  thinking: disabled
  cache_enabled: true
  cache_dir: data/cache/ai

rag:
  enabled: true
  # 与 GLM 同一供应商，减少一把密钥的暴露面
  embedding_model: embedding-3
  embedding_dimensions: 1024
  index_dir: data/rag
  knowledge_dir: knowledge
  history_dir: reports/history
  chunk_size: 900
  chunk_overlap: 120
  top_k: 4
  # 合并多个商品的检索结果后，最多保留多少个高分片段
  max_selected_chunks: 12
  max_context_chars: 4000
  min_score: 0.15
  embedding_batch_size: 32

scheduler:
  # 每天北京时间 09:00
  hour: 9
  minute: 0
  # 电脑短暂休眠/任务延迟时，允许多久内补跑
  misfire_grace_seconds: 3600
  # 失败后的有限重试
  max_retries: 2
  retry_delay_seconds: 300
  lock_file: logs/scheduler.lock
  # 锁文件超过 6 小时视为上次进程异常退出
  stale_lock_seconds: 21600

logging:
  level: INFO
  filename: ecom_ops.log
  retention_days: 30
